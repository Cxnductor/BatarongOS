name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm xorriso curl tar gzip git

      - name: Build batarongOS ISO
        run: make

      - name: List build output
        run: ls -lh build/

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: batarongOS-iso
          path: build/batarongOS.iso
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: batarongOS-iso
          path: build

      - name: Show ISO to be released
        run: ls -lh build/batarongOS.iso

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ### batarongOS ${{ github.ref_name }}

            Bootable ISO built from commit ${{ github.sha }}.
            Flash to a USB drive or boot in a VM (e.g. QEMU with `-cdrom build/batarongOS.iso`).
          files: build/batarongOS.iso
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
